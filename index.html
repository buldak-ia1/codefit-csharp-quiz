<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#151c2c">
  <meta name="application-name" content="코드핏">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="코드핏">
  <meta name="description" content="객관식, 주관식, 빈칸, 코딩 문제를 연습하는 C# 학습 앱">
  <title>코드핏 | C# 시험 문제 풀이</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/app-icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/app-icon-192.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <button class="brand" id="brandButton" aria-label="홈으로 이동">
        <span class="brand-mark">C#</span>
        <span>
          <strong>코드핏</strong>
          <small>짧게, 자주, 확실하게</small>
        </span>
      </button>
      <div class="topbar-actions">
        <button class="install-button" id="installButton" type="button">
          <span>↓</span> 앱 설치
        </button>
        <button class="icon-button" id="resetButton" aria-label="학습 기록 초기화" title="학습 기록 초기화">
          ↻
        </button>
      </div>
    </header>

    <main id="app" aria-live="polite"></main>
  </div>

  <template id="homeTemplate">
    <section class="hero">
      <div class="hero-copy">
        <span class="eyebrow">C# 핵심 개념 트레이닝</span>
        <h1>오늘도 한 문제씩,<br><em>실력은 선명하게.</em></h1>
        <p>객관식부터 코딩까지 원하는 방식으로 연습하세요.</p>
      </div>
      <div class="streak-card">
        <div class="streak-ring">
          <strong data-stat="solved">0</strong>
          <span>푼 문제</span>
        </div>
        <div>
          <small>누적 정답률</small>
          <strong data-stat="accuracy">0%</strong>
          <p data-stat="message">첫 문제를 풀어보세요.</p>
        </div>
      </div>
    </section>

    <section class="section-block">
      <div class="section-heading">
        <div>
          <span class="eyebrow">빠른 시작</span>
          <h2>랜덤 믹스</h2>
        </div>
        <span class="pill">추천</span>
      </div>
      <button class="mix-card" data-action="start-mix">
        <span class="mix-icon">✦</span>
        <span class="mix-copy">
          <strong>모든 유형 섞어서 풀기</strong>
          <small>객관식 · 주관식 · 빈칸 · 코딩 중 랜덤 10문제</small>
        </span>
        <span class="arrow">→</span>
      </button>
    </section>

    <section class="section-block">
      <div class="section-heading">
        <div>
          <span class="eyebrow">집중 연습</span>
          <h2>유형별 문제</h2>
        </div>
        <small class="muted">유형을 골라 시작하세요</small>
      </div>
      <div class="type-grid" id="typeGrid"></div>
    </section>

    <section class="section-block compact">
      <div class="section-heading">
        <div>
          <span class="eyebrow">학습 현황</span>
          <h2>최근 기록</h2>
        </div>
      </div>
      <div class="history-list" id="historyList"></div>
    </section>
  </template>

  <script src="app.js"></script>
</body>
</html>
